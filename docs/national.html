<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Command Center · National TV</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e8eaef; --muted: #9aa3b2; --faint: #6b7383;
    --accent: #4f9cf7; --good: #3fbf7f; --warn: #e5a93b; --bad: #e5604f; --live: #ff4d6d;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #fff; --panel2: #f0f2f5; --line: #e1e4ea; --text: #161a22; --muted: #5b6474; --faint: #8a93a3; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 16px 8px; max-width: 980px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  main { max-width: 980px; margin: 0 auto; padding: 0 12px 40px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 22px 4px 10px; }
  .games { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; }
  .game { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; min-width: 170px; }
  .game .teams { font-weight: 650; }
  .game .state { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .game.live { border-color: var(--live); }
  .game.live .state { color: var(--live); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; grid-template-columns: 58px 1fr; gap: 12px; }
  .card.hit { border-color: var(--good); }
  .pct { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 16px;
         background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--panel2) 0); position: relative; }
  .pct::before { content: ""; position: absolute; inset: 6px; background: var(--panel); border-radius: 50%; }
  .pct span { position: relative; }
  .card.hit .pct { background: var(--good); }
  .card.hit .pct::before { background: var(--good); }
  .card.hit .pct span { color: #fff; }
  .who { font-weight: 650; }
  .team { color: var(--faint); font-weight: 500; font-size: 12px; margin-left: 4px; }
  .what { margin-top: 2px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .chip { font-size: 11.5px; padding: 2px 7px; border-radius: 999px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
  .chip.review { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .chip.out { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .chip.dtd { color: var(--warn); }
  .chip.live { color: var(--live); border-color: var(--live); font-weight: 600; }
  .chip.hit { color: var(--good); border-color: var(--good); font-weight: 600; }
  details { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  summary { cursor: pointer; color: var(--faint); }
  details ul { margin: 4px 0 0 16px; padding: 0; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--panel2); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 2px 10px; }
  select, input[type=search] { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 14px; }
  label { color: var(--muted); font-size: 13px; }
  button { background: var(--panel); color: var(--accent); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  .empty { color: var(--faint); padding: 12px 4px; }
  footer { color: var(--faint); font-size: 12px; max-width: 980px; margin: 0 auto; padding: 0 16px 30px; }
  .warn-banner { background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; margin: 10px 0; }
  @media (max-width: 600px) { .hide-sm { display: none; } }
  nav { display: flex; flex-wrap: wrap; row-gap: 4px; gap: 14px; margin-top: 6px; font-size: 13.5px; }
  nav a { color: var(--muted); text-decoration: none; padding-bottom: 2px; }
  nav a.on { color: var(--text); border-bottom: 2px solid var(--accent); }
  .match { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .match h3 { margin: 0 0 6px; font-size: 15px; }
  .match table { border: 0; background: transparent; table-layout: fixed; }
  .match td, .match th { padding: 5px 6px; font-size: 13px; }
  .match col.l { width: 42%; } .match col.t { width: 19%; } .match col.b { width: 20%; }
  .matches { grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); }
  @media (max-width: 600px) { .match td, .match th { padding: 5px 4px; font-size: 12.5px; } }
  .match th.c, .match td.c { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .match th.c.team-h { color: var(--text); font-weight: 700; font-size: 13px; }
  .match td.base, .match th.base { color: var(--faint); }
  th.num { text-align: right; }
  .matches { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
  .scroll { overflow-x: auto; border-radius: var(--radius); }
  .scroll table { min-width: 860px; }
  th.sort { cursor: pointer; }
  th.sort.on { color: var(--accent); }
  .hi { color: var(--good); }
  .lo { color: var(--bad); }
  .hi.strong, .lo.strong { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
  .flag { color: var(--warn); }
  .key { color: var(--muted); font-size: 12.5px; margin: 0 4px 8px; }
  .key b.hi, .key b.lo { font-weight: 650; }
  .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .toggle button { border: 0; border-radius: 0; padding: 5px 10px; font-size: 13px; color: var(--muted); }
  .toggle button.on { background: var(--accent); color: #fff; }
  .odd { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 0; margin: 0; list-style: none; }
  .odd li { padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .odd li:last-child { border-bottom: 0; }
  .odd .luck { color: var(--faint); font-size: 12px; white-space: nowrap; }
  header, main, footer { max-width: 1180px; }
  .nets { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; }
  .net { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px; min-width: 175px; }
  .net .teams { font-weight: 650; }
  .net .state { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .net.today { border-color: var(--accent); }
  td.chg { font-weight: 650; }
  .small { color: var(--faint); font-size: 12px; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--line); margin-left: 4px; white-space: nowrap; }
  .badge.confirmed { color: var(--good); border-color: var(--good); }
  .badge.added { color: var(--accent); border-color: var(--accent); font-weight: 650; }
  .badge.dropped { color: var(--bad); border-color: var(--bad); font-weight: 650; }
  .badge.changed { color: var(--warn); border-color: var(--warn); font-weight: 650; }
  .badge.guide { color: var(--faint); }
  .net.dropped { opacity: .65; }
  .net.dropped .teams { text-decoration: line-through; }
  #teams th.sort { cursor: pointer; }
  .flexbox { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: var(--radius); padding: 8px 12px; margin: 8px 0 4px; font-size: 13.5px; }
</style>
</head>
<body>
<header>
  <h1>NBA Command Center</h1>
  <nav><a href="./">Watch List</a><a href="situations.html">Team situations</a><a href="standings.html">Standings</a><a href="clutch.html">Clutch</a><a href="players.html">With / without</a><a href="trends.html">Streaks &amp; outliers</a><a href="leaders.html">Team leaders</a><a href="defenses.html">vs top teams</a><a class="on" href="national.html">National TV</a><a href="gameflow.html">Game Flow</a><a href="records.html">Records</a><a href="find.html">Index</a></nav>
  <div class="sub" id="sub">Loading…</div>
</header>
<main>
  <h2>Next national games <span class="small" id="nextNote"></span></h2>
  <div class="nets" id="next"></div>
  <div id="flexed"></div>
  <h2>Players: national TV vs League Pass games</h2>
  <div class="controls">
    <select id="team"><option value="">All teams</option></select>
    <label>National games played <select id="min"><option value="1">1+</option><option value="2" selected>2+</option><option value="3">3+</option><option value="5">5+</option></select></label>
    <label>Minutes a game (both) <select id="mpg"><option value="0">any</option><option value="15" selected>15+</option><option value="25">25+</option></select></label>
    <span class="toggle" id="dir"><button data-d="up" class="on">Better on national TV first</button><button data-d="down">Worse on national TV first</button></span>
    <input type="search" id="q" placeholder="Player">
  </div>
  <div class="key" id="key"></div>
  <div class="scroll"><table id="players"></table></div>
  <div class="pager" id="ppager" style="display:flex;gap:10px;align-items:center;margin:8px 2px 18px;font-size:13px;flex-wrap:wrap"></div>
  <h2>Teams: record on national TV, by network</h2>
  <div class="controls">
    <input type="search" id="tq" placeholder="Team (e.g. NYK, BOS)">
    <select id="tconf"><option value="">East and West</option><option value="E">East</option><option value="W">West</option></select>
    <select id="tnet"><option value="">Any network</option></select>
    <label><input type="checkbox" id="tsoon"> national game in the next 7 days</label>
  </div>
  <div class="key" id="tkey"></div>
  <div class="scroll"><table id="teams"></table></div>
</main>
<footer id="foot"></footer>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STATS = [["pts", "PTS"], ["reb", "REB"], ["ast", "AST"], ["fg3m", "3PM"], ["tsPct", "TS%"], ["pm", "+/-"], ["min", "MIN"]];
let D = null, sortKey = "pts", dir = "up", tsort = "nat", tdir = 1;
const CONF = Object.fromEntries([..."ATL BOS BKN CHA CHI CLE DET IND MIA MIL NYK ORL PHI TOR WAS".split(" ").map((t) => [t, "E"]), ..."DAL DEN GSW HOU LAC LAL MEM MIN NOP OKC PHX POR SAC SAS UTA".split(" ").map((t) => [t, "W"])]);
const BADGE = { confirmed: "confirmed on ESPN", added: "added (flexed in)", dropped: "off ESPN's national list (flexed out?)", changed: "network changed", guide: "guide only (not on ESPN yet)" };
const f1 = (x) => (x == null ? "–" : (Math.round(x * 10) / 10).toFixed(1));
const sgn = (x) => (x == null ? "–" : `${x > 0 ? "+" : ""}${f1(x)}`);
const chg = (p, k) => (p.nat[k] == null || p.other[k] == null ? null : Math.round((p.nat[k] - p.other[k]) * 10) / 10);
const md = (d) => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}`;
const today = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });

// 0.94 (the user, 11/17: "this list will get long, maybe add pages"): 25 players a page.
const PER = 25; let page = 0, pageKey = "";
function render() {
  const onTv = new Set(D.upcoming.filter((g) => g.d === today && g.status !== "dropped").flatMap((g) => [g.away, g.home]));
  const team = $("team").value, min = +$("min").value, mpg = +$("mpg").value, q = $("q").value.trim().toLowerCase();
  const rows = D.players.filter((p) => (!team || p.team === team) && p.nat.gp >= min && p.other.gp >= 1 && p.nat.min >= mpg && p.other.min >= mpg && (!q || p.name.toLowerCase().includes(q)))
    .sort((a, b) => ((chg(b, sortKey) ?? -1e9) - (chg(a, sortKey) ?? -1e9)) * (dir === "up" ? 1 : -1) || a.name.localeCompare(b.name));
  const pk = [team, min, mpg, q, sortKey, dir].join("|"); if (pk !== pageKey) { page = 0; pageKey = pk; }
  const pages = Math.max(1, Math.ceil(rows.length / PER)); page = Math.min(page, pages - 1);
  $("ppager").innerHTML = rows.length > PER ? `<button id="pprev"${page ? "" : " disabled"}>‹ Previous</button><span>${page * PER + 1}–${Math.min(rows.length, page * PER + PER)} of ${rows.length} · page ${page + 1} of ${pages}</span><button id="pnext"${page < pages - 1 ? "" : " disabled"}>Next ›</button>` : "";
  if ($("pprev")) $("pprev").onclick = () => { page--; render(); };
  if ($("pnext")) $("pnext").onclick = () => { page++; render(); };
  const cell = (p, k) => { const c = chg(p, k), lo = k === "pm" ? 3 : k === "tsPct" ? 5 : k === "min" ? 4 : 2;
    return `<td class="num">${f1(p.nat[k])}</td><td class="num">${f1(p.other[k])}</td><td class="num chg ${c == null ? "" : c >= lo ? "hi" : c <= -lo ? "lo" : ""}">${sgn(c)}</td>`; };
  $("players").innerHTML = `<tr><th rowspan=2>Player</th><th rowspan=2 class="num">GP<br><span class=small>nat / LP</span></th>${STATS.map(([k, l]) => `<th colspan=3 class="num sort${k === sortKey ? " on" : ""}" data-k="${k}" title="sort by the change; click again to flip">${l}${k === sortKey ? (dir === "up" ? " ▾" : " ▴") : ""}</th>`).join("")}</tr>
    <tr>${STATS.map(() => `<th class="num">nat</th><th class="num" title="local TV / League Pass">LP</th><th class="num">chg</th>`).join("")}</tr>` +
    (rows.length ? rows.slice(page * PER, page * PER + PER).map((p) => `<tr><td><b>${esc(p.name)}</b> <span class="team">${esc(p.team)}</span>${onTv.has(p.team) ? ` <span class="small" title="on national TV tonight">📺 tonight</span>` : ""}</td><td class="num">${p.nat.gp} / ${p.other.gp}</td>${STATS.map(([k]) => cell(p, k)).join("")}</tr>`).join("")
      : `<tr><td colspan=${2 + STATS.length * 3} class="empty">No players match.</td></tr>`);
  // Click a stat to sort by its change; click it again to flip between better-first and worse-first.
  document.querySelectorAll("#players th.sort").forEach((th) => th.onclick = () => { if (sortKey === th.dataset.k) dir = dir === "up" ? "down" : "up"; else { sortKey = th.dataset.k; dir = "up"; } syncDir(); render(); });
  const label = Object.fromEntries(STATS)[sortKey];
  $("key").innerHTML = `${rows.length} players · per-game averages in national games (<b>nat</b>: ABC, ESPN, NBC, Peacock, Prime Video) and in his other games (<b>LP</b>: local TV, on League Pass out of market) · <b>chg</b> = nat minus LP · sorted by the ${label} change, ${dir === "up" ? "<b>better on national TV first</b>" : "<b>worse on national TV first</b>"} (click a stat to sort, again to flip) · <b class="hi">green</b> / <b class="lo">red</b>: a clear change (2+ PTS/REB/AST/3PM, 5+ TS%, 3+ +/-). Early in the season most players have only a few national games: read the GP column first. A clear points split (3+ games each way, 20+ minutes, 4+ points and 20%+) is flagged on the Watch List when he plays on national TV that night.`;
  const NETS = D.networks || ["ABC", "ESPN", "NBC", "Peacock", "Prime Video"];
  const wl = (r) => (r && r.w + r.l ? `${r.w}-${r.l}` : "–");
  const pc = (r) => (r && r.w + r.l ? ` <span class=small>(${((r.w / (r.w + r.l)) * 100).toFixed(0)}%)</span>` : "");
  const live = D.upcoming.filter((g) => g.status !== "dropped");
  const nextOf = (t) => live.find((g) => g.away === t || g.home === t);
  const leftOf = (t) => live.filter((g) => g.away === t || g.home === t).length;
  const soon = new Date(Date.parse(today + "T12:00:00Z") + 7 * 864e5).toISOString().slice(0, 10);
  const tq = $("tq").value.trim().toUpperCase(), conf = $("tconf").value, net = $("tnet").value;
  let T = Object.entries(D.teams).map(([t, r]) => ({ t, ...r, np: r.nat.w + r.nat.l ? r.nat.w / (r.nat.w + r.nat.l) : null, op: r.other.w + r.other.l ? r.other.w / (r.other.w + r.other.l) : null, next: nextOf(t), left: leftOf(t) }))
    .filter((r) => (!tq || r.t.includes(tq)) && (!conf || CONF[r.t] === conf) && (!net || (r.byNet?.[net] && r.byNet[net].w + r.byNet[net].l) || live.some((g) => (g.away === r.t || g.home === r.t) && g.networks.includes(net))) && (!$("tsoon").checked || (r.next && r.next.d <= soon)));
  const TS = { nat: (r) => r.nat.w + r.nat.l + (r.np ?? 0), np: (r) => r.np ?? -1, op: (r) => r.op ?? -1, next: (r) => (r.next ? -Date.parse(r.next.d) : -1e15), left: (r) => r.left };
  T.sort((a, b) => (TS[tsort](b) - TS[tsort](a)) * tdir || a.t.localeCompare(b.t));
  const th = (k, label, title = "") => `<th class="num sort${tsort === k ? " on" : ""}" data-k="${k}" title="${title}">${label}${tsort === k ? (tdir > 0 ? " ▾" : " ▴") : ""}</th>`;
  const nx = (g, t) => g ? `${md(g.d)} ${g.home === t ? "vs" : "@"} ${g.home === t ? g.away : g.home} <span class=small>${esc(g.networks.join("/"))}</span>${g.status !== "guide" ? "" : ` <span class="badge guide" title="from the Tip-Off Guide; ESPN lists broadcasts about three weeks out">guide</span>`}` : "–";
  $("teams").innerHTML = `<tr><th>Team</th>${th("nat", "All national", "W-L in national games played")}${NETS.map((n) => `<th class="num">${esc(n)}</th>`).join("")}${th("op", "League Pass", "W-L in every other game")}${th("next", "Next national", "the next national game, as ESPN lists it (or the guide, if more than three weeks away)")}${th("left", "National games left", "this team's national games from today to the end of the regular season (the guide's schedule, with ESPN's flexes in the next three weeks)")}</tr>` +
    (T.length ? T.map((r) => `<tr><td><b>${r.t}</b></td><td class="num"><b>${wl(r.nat)}</b>${pc(r.nat)}</td>${NETS.map((n) => `<td class="num">${wl(r.byNet?.[n])}</td>`).join("")}<td class="num">${wl(r.other)}${pc(r.other)}</td><td class="num">${nx(r.next, r.t)}</td><td class="num">${r.left || "–"}</td></tr>`).join("") : `<tr><td class="empty" colspan="${5 + NETS.length}">No teams match.</td></tr>`);
  document.querySelectorAll("#teams th.sort").forEach((x) => x.onclick = () => { if (tsort === x.dataset.k) tdir = -tdir; else { tsort = x.dataset.k; tdir = 1; } render(); });
  $("tkey").innerHTML = `<b>National games left</b>: the team's national games from today through the end of the regular season. <b>Next national</b>: its next one; within about three weeks it is as ESPN lists it now (flexes included), further out it is the Tip-Off Guide's (marked <i>guide</i>, subject to change). Click a column to sort. W-L in each network's games. NBC games are simulcast on Peacock, so they count in both columns (Peacock alone also has its own Monday games); ABC/ESPN simulcasts the same way. "All national" counts each game once. League Pass: every other game (local TV).`;
}
function syncDir() { document.querySelectorAll("#dir button").forEach((x) => x.classList.toggle("on", x.dataset.d === dir)); }
fetch("data/national.json", { cache: "no-store" }).then((r) => r.json()).then((d) => {
  D = d;
  $("sub").textContent = `How players do on national TV (ABC, ESPN, NBC, Peacock, Prime Video) vs their League Pass (local TV) games · ${d.played} of ${d.total} national games played · through ${md(d.through)}`;
  const two = new Date(Date.parse(today + "T12:00:00Z") + 14 * 864e5).toISOString().slice(0, 10);
  const nextList = d.upcoming.filter((g) => g.d <= two);
  $("nextNote").textContent = d.espnThrough ? `· the next two weeks, checked against ESPN's broadcast listings through ${md(d.espnThrough)} on every build` : "";
  $("next").innerHTML = nextList.length ? nextList.map((g) => `<div class="net${g.d === today ? " today" : ""}${g.status === "dropped" ? " dropped" : ""}"><div class="teams">${g.away} ${g.neutral ? "vs" : "@"} ${g.home}</div><div class="state">${g.d === today ? "Today" : new Date(g.d + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "numeric", day: "numeric", timeZone: "UTC" })}${g.time ? ` · ${g.time} ET` : ""} · ${esc((g.status === "dropped" ? g.guide : g.networks).join(" / "))}${g.status === "changed" ? ` <span class=small>(guide: ${esc(g.guide.join(" / "))})</span>` : ""}</div><div class="state"><span class="badge ${g.status || "guide"}">${BADGE[g.status || "guide"]}</span></div></div>`).join("") : `<div class="empty">No national games in the next two weeks.</div>`;
  const fx = (d.flexed || []).filter((g) => g.d >= today);
  $("flexed").innerHTML = fx.length ? `<div class="flexbox"><b>Changes from the Tip-Off Guide:</b> ${fx.map((g) => `${md(g.d)} ${g.away} @ ${g.home}: ${g.status === "added" ? `now on ${esc(g.networks.join("/"))}` : g.status === "dropped" ? `no longer listed on ${esc(g.guide.join("/"))}` : `${esc(g.guide.join("/"))} → ${esc(g.networks.join("/"))}`}`).join(" · ")}</div>` : "";
  $("tnet").innerHTML += (d.networks || []).map((n) => `<option>${esc(n)}</option>`).join("");
  ["tq", "tconf", "tnet", "tsoon"].forEach((id) => $(id).addEventListener("input", render));
  const teams = [...new Set(d.players.map((p) => p.team))].sort();
  $("team").innerHTML += teams.map((t) => `<option>${t}</option>`).join("");
  ["team", "min", "mpg", "q"].forEach((id) => $(id).addEventListener("input", render));
  document.querySelectorAll("#dir button").forEach((b) => b.onclick = () => { dir = b.dataset.d; syncDir(); render(); });
  $("foot").innerHTML = `National games: the NBA's 2026-27 Tip-Off Guide national schedule (ABC, ESPN, NBC, Peacock incl. the Monday Peacock/NBCSN games, Prime Video; not NBA TV or ESPN Radio), checked against ESPN's broadcast listings for every game played. Regular season; only games a player played count; a traded player's games are combined. Not a forecast: a baseline for who rises (or fades) with the bigger spotlight.`;
  render();
}).catch((e) => { $("sub").textContent = `Couldn't load the data: ${e.message}`; });
</script>
</body>
</html>
