# Keeps the site current with no PC and no chat session running.
# Times are UTC (GitHub runs cron in UTC); Eastern equivalents in winter / summer:
#   13:00  build       8:00 AM /  9:00 AM ET  storylines for days with early tips (Cloudflare sends them 2 h before tip)
#   15:30  build      10:30 AM / 11:30 AM ET  morning slate
#   18:00  build       1:00 PM /  2:00 PM ET  fresh storylines for the 2 PM ET digest (Cloudflare sends it)
#   20:00  build       3:00 PM /  4:00 PM ET  notes posted after shootaround
#   22:30  build       5:30 PM /  6:30 PM ET  pre-game, before 7 PM tips
#   08:30  score       3:30 AM /  4:30 AM ET  last night (west-coast games done)
#   12:00  score       7:00 AM /  8:00 AM ET  again, in case a game ran late
# GitHub may start a scheduled run late under load (on 11/11 the 20:00 run
# started at 21:27).
name: daily

on:
  schedule:
    - cron: "0 13 * * *"   # 8 AM ET: fresh storylines for a day with early tips (Cloudflare sends them 2 h before tip)
    - cron: "30 15 * * *"
    - cron: "0 18 * * *"   # 1 PM ET: fresh storylines for the 2 PM digest (sent by Cloudflare)
    - cron: "0 20 * * *"
    - cron: "30 22 * * *"
    - cron: "30 8 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "build or score"
        default: build
      date:
        description: "YYYY-MM-DD (blank = today for build, yesterday for score)"
        default: ""
  push:
    branches: [main]
    paths: [".github/workflows/daily.yml", "scripts/ci.js", "scripts/situations.js", "scripts/flow.js", "src/gameflow/**", "scripts/notify.js", "scripts/tonight.js", "src/notes/**", "src/rosters/**", "src/records/**", "src/data/**", "src/situations/**", "src/injuries/**", "src/anticipate/tonight.js"]

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Build on the latest main, not the commit that was current when the run was queued.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pick the job
        id: pick
        run: |
          job="${{ github.event.inputs.job }}"
          if [ -z "$job" ]; then
            case "${{ github.event.schedule }}" in
              "30 8 * * *"|"0 12 * * *") job=score ;;
              *) job=build ;;
            esac
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
      - name: Build tonight's slate
        if: steps.pick.outputs.job == 'build'
        run: node scripts/ci.js build ${{ github.event.inputs.date && format('--today {0}', github.event.inputs.date) || '' }}
      # The pre-game storylines to #alerts are sent by the Cloudflare Worker (cloudflare/digest.js) since
      # 0.28.1: on time, and around early tips. scripts/notify.js stays for a manual send
      # (DISCORD_WEBHOOK=… node scripts/notify.js --force), but no longer runs here.
      - name: Score last night
        if: steps.pick.outputs.job == 'score'
        run: node scripts/ci.js score ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
      - name: Commit and push
        run: |
          git config user.name "ncc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/lib docs/ref history
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "${{ steps.pick.outputs.job }}: $(TZ=America/New_York date +'%Y-%m-%d %H:%M') ET (automatic)"
          # Another run may have pushed meanwhile. Everything committed here is
          # generated data, so on a clash keep this run's (newer) files: in a
          # rebase, -X theirs means the commit being replayed, i.e. this run's.
          for i in 1 2 3; do
            git pull --rebase -X theirs --quiet origin main && git push --quiet origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "push failed"; exit 1
