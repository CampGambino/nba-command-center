# Checks code pushed straight to main (0.141.4). Code is meant to arrive through `dev` ("test and publish"), which
# tests before publishing; a push made directly (from github.com, say) skips that. This runs the same checks after
# the fact and turns red if any fail, so it is seen. The bot's data commits don't start it (they touch none of these
# paths), and nor do the publish job's pushes (made with the job's own token, which starts no workflows).
name: check main

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "cloudflare/**"
      - "tests/**"
      - "docs/*.html"
      - "docs/bridge/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tests/articles-only.js
      - run: node tests/run.js
