# One read of pr.nba.com's fine and suspension releases (0.143.0; the user, 11/23). Read only: the releases go to a
# private workflow download for tools/pr-fines-parse.mjs; nothing is committed or posted. The log prints counts and dates.
name: pr fines (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Read the releases
        run: node tools/pr-fines-fetch.mjs pr-fines.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-fines
          path: pr-fines.json
          retention-days: 3
