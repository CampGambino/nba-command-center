# Can GitHub's runners reach NBA.com's stats site? (0.151.0, temporary: the nightly rotations pull runs here if so, on the
# user's PC if not.) Read-only: three requests, their status printed. Remove once answered.
name: nbacom probe
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: stats.nba.com
        run: |
          for u in "leaguegamelog?Counter=0&Direction=ASC&LeagueID=00&PlayerOrTeam=T&Season=2026-27&SeasonType=Regular+Season&Sorter=DATE" "gamerotation?GameID=0022600001&LeagueID=00" "boxscorehustlev2?GameID=0022600001"; do
            code=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 40 -H "Referer: https://www.nba.com/" -H "Origin: https://www.nba.com" -H "Accept: application/json" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36" "https://stats.nba.com/stats/$u" || echo "000")
            echo "$code ${u%%\?*} $(wc -c < /tmp/r.json 2>/dev/null) bytes"
          done
