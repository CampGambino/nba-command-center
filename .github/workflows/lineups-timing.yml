# Prints one night's lineup TIMING from the Worker's storage (times and post results only: no names, so
# nothing from NBA.com's file reaches this public log). Run by hand: gh workflow run lineups-timing.yml.
name: lineup timing (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Read the Worker's lineup state (times only)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 kv key get --remote --binding STATE lineups > /tmp/st.json 2>/dev/null || npx --yes wrangler@3 kv:key get --binding STATE lineups > /tmp/st.json
          node -e '
            const st = JSON.parse(require("fs").readFileSync("/tmp/st.json", "utf8"));
            const et = (ms) => ms ? new Date(ms).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit", second: "2-digit" }) : null;
            console.log("date", st.date, "done", !!st.done);
            for (const g of st.sched || []) for (const tri of g.teams) {
              const s = st.teams?.[tri] || {}, w = s.when || {};
              console.log(JSON.stringify({ team: tri, tip: et(g.tip), expectedSeen: !!s.expected, posted: !!s.posted, tipResult: s.tip || null,
                feedStamp: w.feed ? new Date(w.feed).toISOString() : null, seen: et(w.seen), postedAt: et(w.posted), changes: (w.changes || []).map((c) => ({ seen: et(c.seen), posted: et(c.posted) })), tipSeen: et(w.tipSeen) }));
            }'
