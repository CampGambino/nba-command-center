# One-off looks at outside sources from GitHub (the cloud workspace cannot reach them): runs tools/probe/run.mjs and
# commits what it found to tools/probe/out.json. Runs when the script changes, or by hand. Read only; no secrets.
name: probe
on:
  push:
    branches: [main]
    paths: ["tools/probe/run.mjs", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/probe/run.mjs
      - name: Commit
        run: |
          git config user.name "ncc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe/out.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "probe: $(TZ=America/New_York date +'%Y-%m-%d %H:%M') ET (automatic)"
          for i in 1 2 3; do
            git pull --rebase -X theirs --quiet origin main && git push --quiet origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "push failed"; exit 1
